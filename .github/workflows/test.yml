name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '*.asciidoc'
      - '.github/workflows/create-release.yml'
      - '.github/workflows/nightly.yml'
  pull_request:
    paths-ignore:
      - '*.md'
      - '*.asciidoc'
      - '.github/workflows/create-release.yml'
      - '.github/workflows/nightly.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      # https://github.com/actions/runner-images/issues/2840
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # 1.3.1
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # defaults are true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout the repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          add-job-summary-as-pr-comment: 'on-failure'

      - name: Setup TestLens
        uses: testlens-app/setup-testlens@d29a2be31512b3aeda3adcef09fbe0d55af90c51 # v1.9.4

      - name: Execute buildHealth (build-logic)
        run: './gradlew -p build-logic/ buildHealth'

      - name: Execute check (build-logic)
        run: './gradlew -p build-logic/ check'

      - name: Execute buildHealth (main)
        run: './gradlew buildHealth'

      - name: Execute buildHealth (testkit)
        run: './gradlew -p testkit/ buildHealth'

      - name: Execute check (testkit)
        run: './gradlew -p testkit/ check'

      - name: Execute check (main, non-functional tests)
        run: './gradlew check -s -x :functionalTest'

      - name: Execute JVM functional tests
        run: './gradlew :functionalTest -DfuncTest.package=jvm -DfuncTest.quick'

      - name: Execute Android functional tests
        run: './gradlew :functionalTest -DfuncTest.package=android -DfuncTest.quick'

      - name: Execute KMP functional tests
        run: './gradlew :functionalTest -DfuncTest.package=kmp -DfuncTest.quick'

      - name: Check API
        run: './gradlew :checkApi'

      - name: Publish snapshot
        if: github.repository == 'autonomousapps/dependency-analysis-gradle-plugin' && github.ref == 'refs/heads/main'
        run: './gradlew :publishToMavenCentral'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
