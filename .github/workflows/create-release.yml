name: Create Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Extract release notes
        run: |
          awk -v header="# Version ${GITHUB_REF_NAME#v}" '
            /^# Version / { found = ($0 == header); next }
            found
          ' CHANGELOG.md > release-notes.md

      - name: Display release notes
        run: cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: github.repository == 'autonomousapps/dependency-analysis-gradle-plugin' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
